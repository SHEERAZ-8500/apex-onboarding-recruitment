<div class="client-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="!showForm; else formPage">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Clients</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Clients Table -->
      <div class="clients-list-section">
        <div class="table-container">
          <table class="table table-bordered client-table">
            <thead>
              <tr>
                <th>Customer No</th>
                <th>Customer Name</th>
                <th>Bank Name</th>
                <th>Account No</th>
                <th>City</th>
                <th>To Address</th>
                <th>VAT No</th>
                <th class="action-col-header">Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let item of paginatedClients(); let i = index"
                [class.edit-row]="editIndex === currentPageStart + i">
                <td>{{ item.customerNo }}</td>
                <td>{{ item.customerName }}</td>
                <td>{{ item.bankName }}</td>
                <td>{{ item.accountNo }}</td>
                <td>{{ item.city }}</td>
                <td>{{ item.toAddress }}</td>
                <td>{{ item.vatNo }}</td>

                <td class="action-col">
                  <i class="fa fa-edit action-icon" (click)="editClient(currentPageStart + i)"></i>
                  <i class="fa fa-trash action-icon" (click)="deleteClient(currentPageStart + i)"></i>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-end mt-3 me-3">
          <nav aria-label="Page navigation">
            <ul class="pagination">

              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="changePage(currentPage - 1)">
                  &laquo;
                </a>
              </li>

              <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="page === currentPage">
                <a class="page-link" (click)="changePage(page)">
                  {{ page }}
                </a>
              </li>

              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="changePage(currentPage + 1)">
                  &raquo;
                </a>
              </li>

            </ul>
          </nav>
        </div>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
  <ng-template #formPage>
    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ isEdit ? "Edit Client" : "Add Client" }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <!-- Customer Code (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>Customer Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Customer Code" [(ngModel)]="customerNo"
            [readonly]="isEdit" />
        </div>

        <!-- Customer Name (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>Customer Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Customer Name" [(ngModel)]="customerName" />
        </div>

        <!-- Bank Name (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>Bank Name</label>
          <input type="text" class="form-control" placeholder="Enter Bank Name" [(ngModel)]="bankName" />
        </div>

        <!-- Account No (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>Account No</label>
          <input type="text" class="form-control" placeholder="Enter Account Number" [(ngModel)]="accountNo" />
        </div>

        <!-- City (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>City</label>
          <input type="text" class="form-control" placeholder="Enter City" [(ngModel)]="city" />
        </div>

        <!-- To Address (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>To Address</label>
          <input type="text" class="form-control" placeholder="Enter To Address" [(ngModel)]="toAddress" />
        </div>

        <!-- VAT No (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>VAT No</label>
          <input type="text" class="form-control" placeholder="Enter VAT Number" [(ngModel)]="vatNo" />
        </div>

      </div>


      <!-- Buttons -->
      <div class="btn-row text-end mt-2">
        <button class="btn btn-primary" (click)="isEdit ? updateClient() : createClient()" [disabled]="!isFormValid()">
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
      </div>
    </div>
  </ng-template>
</div>
