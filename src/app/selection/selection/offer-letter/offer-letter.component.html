<div class="skills-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Offer Letters</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage"
          (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText"
                       (ngModelChange)="updatePagination()"
 />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Offer Letters Table -->
      <div class="skills-list-section">
        <table class="table table-bordered skill-table">
          <thead>
            <tr>
              <th>Sr.</th>
              <th>Name</th>
              <th>Designation Name</th>
              <th>Department Name</th>
              <th>Status</th>
              <th>Reason</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of paginatedOfferLettersList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i">
              <td>{{ currentPageStart + i + 1 }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.designationName }}</td>
              <td>{{ item.departmentName }}</td>
              <td>
                <span [class]="getStatusClass(item.status)">
                  {{ item.status }}
                </span>
              </td>
              <td>{{ item.reason }}</td>

              <td class="action-col">
                <i class="fa fa-edit action-icon" (click)="editOfferLetter()"></i>
                <i class="fa fa-trash action-icon" (click)="deleteOfferLetter(currentPageStart + i)"></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>

  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">
      

      

        <div class="col-md-6 mb-3">
          <label>Offer Letter Status <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="offerLetterStatus">
            <option value="" disabled selected>Select Status</option>
            <option value="a">a</option>
            <option value="b">b</option>
            <option value="c">c</option>
            <option value="d">d</option>
            <option value="e">e</option>
          </select>
        </div>

       

        <div class="col-md-6 mb-3">
          <label>Designation Name <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="designationName">
            <option value="" disabled selected>Select Designation</option>
            <option value="a">a</option>
            <option value="b">b</option>
            <option value="c">c</option>
            <option value="d">d</option>
            <option value="e">e</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Department Name <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="departmentName">
            <option value="" disabled selected>Select Department</option>
            <option value="a">a</option>
            <option value="b">b</option>
            <option value="c">c</option>
            <option value="d">d</option>
            <option value="e">e</option>
          </select>
        </div>

      
      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">
        <button class="btn btn-primary" (click)="isEdit ? updateOfferLetter() : createOfferLetter()">
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
      </div>
    </div>
</div>
