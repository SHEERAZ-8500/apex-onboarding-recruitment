<div class="skills-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Medical Insurance</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage"
          (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" 
                       (ngModelChange)="updatePagination()"
/>
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Medical Insurance Table -->
      <div class="skills-list-section">
        <table class="table table-bordered skill-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Description</th>
              <th>From</th>
              <th>To</th>
              <th>Provider</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of paginatedItemsList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i">
              <td>{{ item.code }}</td>
              <td>{{ item.description }}</td>
              <td>{{ item.fromDate | date:'dd/MM/yyyy' }}</td>
              <td>{{ item.toDate | date:'dd/MM/yyyy' }}</td>
              <td>{{ item.provider }}</td>

              <td class="action-col">
                <i class="fa fa-edit action-icon" (click)="editItem()"></i>
                <i class="fa fa-trash action-icon" (click)="deleteItem(currentPageStart + i)"></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
           <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <form class="form-row row" (ngSubmit)="isEdit ? updateItem() : createItem()">

        <div class="col-md-6 mb-3">
          <label>Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Code" [(ngModel)]="itemCode"
            name="code" [readonly]="isEdit" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Description <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Description" [(ngModel)]="itemDescription"
            name="description" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>From Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" [(ngModel)]="itemFromDate" name="fromDate" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>To Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" [(ngModel)]="itemToDate" name="toDate" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Provider <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Provider Name" [(ngModel)]="itemProvider"
            name="provider" required />
        </div>

        <div class="col-12 mt-3">
          <div class="btn-row text-end">
              <button type="button" class="btn btn-danger ms-2" (click)="cancelForm()">
              <i class="fa fa-ban"></i> Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-check-circle"></i>
              {{ isEdit ? "Update" : "Create" }}
            </button>

          
          </div>
        </div>

      </form>
    </div>
</div>
