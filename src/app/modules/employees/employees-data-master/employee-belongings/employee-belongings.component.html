<div class="skills-wrapper col-md-12">

  <!--   LIST VIEW (When showForm = false)  -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Employees Belongings</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage"
          (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" 
                       (ngModelChange)="updatePagination()"
/>
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Employees Belongings Table -->
      <div class="skills-list-section">
        <table class="table table-bordered skill-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Description</th>
              <th>Type</th>
              <th>Depreciation</th>
              <th>Rent</th>
              <th>Belonging Type</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let belonging of paginatedBelongingsList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i">
              <td>{{ belonging.code }}</td>
              <td>{{ belonging.description }}</td>
              <td>{{ belonging.type }}</td>
              <td>{{ belonging.depreciation | currency }}</td>
              <td>{{ belonging.rent | currency }}</td>
              <td>{{ belonging.belongingType }}</td>

              <td class="action-col">
                <i class="fa fa-edit action-icon" (click)="editBelonging(currentPageStart + i)"></i>
                <i class="fa fa-trash action-icon" (click)="deleteBelonging(currentPageStart + i)"></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
         <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>



  <!--   FORM VIEW (NEW / EDIT)     -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <form class="form-row row" (ngSubmit)="isEdit ? updateBelonging() : createBelonging()">

        <div class="col-md-6 mb-3">
          <label>Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Belonging Code" [(ngModel)]="belongingCode"
            name="code" [readonly]="isEdit" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Description <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Description" [(ngModel)]="belongingDescription"
            name="description" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Ownership <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="belongingOwnership" name="ownership" required>
            <option value="" disabled selected>Select Ownership Type</option>
            <option *ngFor="let ownership of ownershipTypes" [value]="ownership">{{ ownership }}</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Belonging Type <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="belongingType" name="belongingType" required>
            <option value="" disabled selected>Select Belonging Type</option>
            <option *ngFor="let type of belongingTypes" [value]="type">{{ type }}</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Unique ID <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Unique ID" [(ngModel)]="belongingUniqueId"
            name="uniqueId" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Model <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Model" [(ngModel)]="belongingModel"
            name="model" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Depreciation Amount <span class="text-danger">*</span></label>
          <input type="number" class="form-control" placeholder="Enter Depreciation Amount" [(ngModel)]="belongingDepreciation"
            name="depreciation" min="0" step="0.01" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Rent Amount <span class="text-danger">*</span></label>
          <input type="number" class="form-control" placeholder="Enter Rent Amount" [(ngModel)]="belongingRent"
            name="rent" min="0" step="0.01" required />
        </div>

        <div class="col-md-12 mb-3">
          <label>Specifications <span class="text-danger">*</span></label>
          <textarea class="form-control" placeholder="Enter Specifications" [(ngModel)]="belongingSpecifications"
            name="specifications" rows="3" required></textarea>
        </div>

        <div class="col-md-12 mb-3">
          <label>Manufacturer <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Manufacturer" [(ngModel)]="belongingManufacturer"
            name="manufacturer" required />
        </div>

        <div class="col-12 mt-3">
          <div class="btn-row text-end">
            

            <button type="button" class="btn btn-danger ms-2" (click)="cancelForm()">
              <i class="fa fa-ban"></i> Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-check-circle"></i>
              {{ isEdit ? "Update" : "Create" }}
            </button>

          </div>
        </div>

      </form>
    </div>
</div>
