<div class="employee-cost-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Employee Costs</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage" (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input
            type="text"
            class="form-control"
            placeholder="Search..."
            [(ngModel)]="searchText"
             (ngModelChange)="updatePagination()"
          />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Employee Costs Table -->
      <div class="employee-cost-list-section">
        <table class="table table-bordered employee-cost-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Description</th>
              <th>Fixed</th>
              <th>Amount</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let item of paginatedEmployeeCostsList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i"
            >
              <td>{{ item.code }}</td>
              <td>{{ item.description }}</td>
              <td>{{ item.fixed ? 'Yes' : 'No' }}</td>
              <td>{{ item.amount }}</td>
              <td class="action-col">
                <i
                  class="fa fa-edit action-icon"
                  (click)="editEmployeeCost()"></i>
                <i
                  class="fa fa-trash action-icon"
                  (click)="deleteEmployeeCost(currentPageStart + i)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
     <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <div class="col-md-6 mb-3">
          <label>Code <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Code"
            [(ngModel)]="code"
            [readonly]="isEdit"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Description <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Description" [(ngModel)]="description" />
        </div>

        <div class="col-md-6 mb-3">
          <label>Fixed <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="fixed">
            <option [value]="true">Yes</option>
            <option [value]="false">No</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Amount <span class="text-danger">*</span></label>
          <input type="number" class="form-control" placeholder="Enter Amount" [(ngModel)]="amount" />
        </div>

      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">

          <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
        <button
          class="btn btn-primary"
          (click)="isEdit ? updateEmployeeCost() : createEmployeeCost()"
        >
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

      
      </div>
    </div>
</div>
