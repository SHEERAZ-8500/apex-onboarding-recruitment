<div class="ramadan-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Ramadan Timings</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage"
          (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input
            type="text"
            class="form-control"
            placeholder="Search..."
            [(ngModel)]="searchText"
                         (ngModelChange)="updatePagination()"

          />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Ramadan Timings Table -->
      <div class="ramadan-list-section">
        <table class="table table-bordered ramadan-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Islamic Year</th>
              <th>Current Year</th>
              <th>Start Date</th>
              <th>End Date</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let item of paginatedRamadanList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i"
            >
              <td>{{ item.name }}</td>
              <td>{{ item.islamicYear }}</td>
              <td>{{ item.currentYear }}</td>
              <td>{{ item.startDate | date:'yyyy-MM-dd' }}</td>
              <td>{{ item.endDate | date:'yyyy-MM-dd' }}</td>
              <td class="action-col">
                <i
                  class="fa fa-edit action-icon"
                  (click)="editRamadan()"
                ></i>
                <i
                  class="fa fa-trash action-icon"
                  (click)="deleteRamadan(currentPageStart + i)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <div class="col-md-6 mb-3">
          <label>Name <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Name"
            [(ngModel)]="name"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Islamic Year <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Islamic Year"
            [(ngModel)]="islamicYear"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Current Year <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="currentYear">
            <option *ngFor="let y of gregorianYears" [value]="y">{{ y }}</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Start Date <span class="text-danger">*</span></label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="startDate"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>End Date <span class="text-danger">*</span></label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="endDate"
          />
        </div>

      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">
        <button
          class="btn btn-primary"
          (click)="isEdit ? updateRamadan() : createRamadan()"
        >
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
      </div>
    </div>
</div>
