<div class="skills-wrapper col-md-12">
  <!--  Show either table or form as "page" -->
  <ng-container *ngIf="!showForm; else formPage">
    <!-- Top Action Bar -->
    <div class="top-action-bar">
      <span class="action-btn" (click)="onNew()">
        <i class="fa fa-plus"></i> New
      </span>

      <!-- Search Input -->
      <div class="search-wrapper ms-auto">
        <input
          type="text"
          class="form-control"
          placeholder="Search..."
          [(ngModel)]="searchText"
        />
        <i class="fa fa-search search-icon"></i>
      </div>
    </div>

    <!-- Skills List Section -->
    <div class="skills-list-section">
      <h5 class="section-title mt-3"><i class="fa fa-bars"></i> Skills List</h5>

      <table class="table table-bordered skill-table">
        <thead>
          <tr>
            <th>Skill Code</th>
            <th>Skill Name</th>
            <th class="action-col-header">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let item of paginatedSkills(); let i = index"
            [class.edit-row]="editIndex === currentPageStart + i"
          >
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>

            <td class="action-col">
              <i
                class="fa fa-edit action-icon"
                (click)="editSkill(currentPageStart + i)"
              ></i>
              <i
                class="fa fa-trash action-icon"
                (click)="deleteSkill(currentPageStart + i)"
              ></i>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination-wrapper">
        <span
          class="disabled"
          [class.disabled]="currentPage === 1"
          (click)="prevPage()"
          >« Previous</span
        >

        <span
          *ngFor="let p of visiblePages()"
          [class.active]="currentPage === p"
          (click)="goToPage(p)"
        >
          {{ p }}
        </span>

        <span
          class="disabled"
          [class.disabled]="currentPage === totalPages"
          (click)="nextPage()"
          >Next »</span
        >
      </div>
    </div>
  </ng-container>

  <!-- Form Page -->
  <ng-template #formPage>
    <div class="form-page">
      <h5 class="section-title mb-3">
        {{ isEdit ? "Edit Skill" : "New Skill" }}
      </h5>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Skill Code <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="skillCode"
            [readonly]="isEdit"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Skill Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="skillName" />
        </div>
      </div>

      <div class="btn-row mt-2">
        <button
          class="btn btn-primary"
          (click)="isEdit ? updateSkill() : createSkill()"
        >
          <i class="fa fa-check-circle"></i> {{ isEdit ? "UPDATE" : "CREATE" }}
        </button>
        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> CANCEL
        </button>
      </div>
    </div>
  </ng-template>
</div>
