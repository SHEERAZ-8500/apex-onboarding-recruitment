<div class="job-title-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Job Titles</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input
            type="text"
            class="form-control"
            placeholder="Search..."
            [(ngModel)]="searchText"
          />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Job Titles Table -->
      <div class="job-title-list-section">
        <table class="table table-bordered job-title-table">
          <thead>
            <tr>
              <th>Job Title Code</th>
              <th>Job Title</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let item of paginatedJobTitles(); let i = index"
              [class.edit-row]="editIndex === currentPageStart + i"
            >
              <td>{{ item.code }}</td>
              <td>{{ item.title }}</td>

              <td class="action-col">
                <i
                  class="fa fa-edit action-icon"
                  (click)="editJobTitle()"
                ></i>
                <i
                  class="fa fa-trash action-icon"
                  (click)="deleteJobTitle(currentPageStart + i)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="d-flex justify-content-end mt-3 me-3">
          <nav aria-label="Page navigation">
            <ul class="pagination">

              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="changePage(currentPage - 1)">
                  &laquo;
                </a>
              </li>

              <li
                class="page-item"
                *ngFor="let page of totalPagesArray"
                [class.active]="page === currentPage"
              >
                <a class="page-link" (click)="changePage(page)">
                  {{ page }}
                </a>
              </li>

              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="changePage(currentPage + 1)">
                  &raquo;
                </a>
              </li>

            </ul>
          </nav>
        </div>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle}}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <!-- Job Title Code -->
        <div class="col-md-6 mb-3">
          <label>Job Title Code <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Job Title Code"
            [(ngModel)]="jobTitleCode"
            [readonly]="isEdit"
          />
        </div>

        <!-- Job Title -->
        <div class="col-md-6 mb-3">
          <label>Job Title <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Enter Job Title" 
            [(ngModel)]="jobTitle" 
          />
        </div>

        <!-- No. Of Working Hours -->
        <div class="col-md-6 mb-3">
          <label>No. Of Working Hours <span class="text-danger">*</span></label>
          <input 
            type="number" 
            class="form-control" 
            placeholder="Enter Working Hours" 
            [(ngModel)]="workingHours"
          />
        </div>

        <!-- Training Required -->
        <div class="col-md-6 mb-3">
          <label>Training Required <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="trainingRequired">
            <option value="">Select Training Required</option>
            <option value="required">Required</option>
            <option value="not required">Not Required</option>
          </select>
        </div>

      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">
        <button
          class="btn btn-primary"
          (click)="isEdit ? updateJobTitle() : createJobTitle()"
        >
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
      </div>
    </div>
</div>
