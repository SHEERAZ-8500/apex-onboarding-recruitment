<div class="trainings-wrapper col-md-12">
  <ng-container *ngIf="!showForm; else formPage">
    <!-- Top Action Bar -->
    <div class="top-action-bar">
      <span class="action-btn" (click)="onNew()">
        <i class="fa fa-plus"></i> New
      </span>

      <div class="search-wrapper ms-auto">
        <input
          type="text"
          class="form-control"
          placeholder="Search..."
          [(ngModel)]="searchText"
        />
        <i class="fa fa-search search-icon"></i>
      </div>
    </div>

    <!-- Trainings List Section -->
    <div class="trainings-list-section">
      <h5 class="section-title mt-3"><i class="fa fa-bars"></i> Trainings List</h5>

      <table class="table table-bordered trainings-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Provider</th>
            <th>Duration</th>
            <th>Created By</th>
            <th class="action-col-header">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of paginatedTrainings(); let i = index"
              [class.edit-row]="editIndex === currentPageStart + i">
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.provider }}</td>
            <td>{{ item.duration }}</td>
            <td>{{ item.createdBy }}</td>
            <td class="action-col">
              <i class="fa fa-edit action-icon" (click)="editTraining(currentPageStart + i)"></i>
              <i class="fa fa-trash action-icon" (click)="deleteTraining(currentPageStart + i)"></i>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-end mt-3 me-3">
        <nav aria-label="Page navigation">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="changePage(currentPage - 1)" aria-label="Previous">&laquo;</a>
            </li>

            <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="page === currentPage">
              <a class="page-link" (click)="changePage(page)">{{ page }}</a>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="changePage(currentPage + 1)" aria-label="Next">&raquo;</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </ng-container>

  <!-- Form Page -->
  <ng-template #formPage>
    <div class="form-page">
      <h5 class="section-title mb-3">{{ isEdit ? "Edit Training" : "New Training" }}</h5>

      <div class="row g-3">
        <div class="col-md-6">
          <label>Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="code" [readonly]="isEdit" />
        </div>

        <div class="col-md-6">
          <label>Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="name" />
        </div>

        <div class="col-md-6">
          <label>Provider <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="provider" />
        </div>

        <div class="col-md-6">
          <label>Duration <span class="text-danger">*</span></label>
          <input type="number" class="form-control" [(ngModel)]="duration" />
        </div>

        <div class="col-md-6">
          <label>Created By <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="createdBy" />
        </div>
      </div>

      <div class="btn-row mt-3">
        <button class="btn btn-primary" (click)="isEdit ? updateTraining() : createTraining()">
          <i class="fa fa-check-circle"></i> {{ isEdit ? "UPDATE" : "CREATE" }}
        </button>
        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> CANCEL
        </button>
      </div>
    </div>
  </ng-template>
</div>
