<div class="qualification-wrapper col-md-12">
  <!--  Show either table or form as "page" -->
  <ng-container *ngIf="!showForm; else formPage">

    <!-- Top Action Bar -->
    <div class="top-action-bar">
      <span class="action-btn" (click)="onNew()">
        <i class="fa fa-plus"></i> New
      </span>

      <!-- Search Input -->
      <div class="search-wrapper ms-auto">
        <input
          type="text"
          class="form-control"
          placeholder="Search..."
          [(ngModel)]="searchText"
        />
        <i class="fa fa-search search-icon"></i>
      </div>
    </div>

    <!-- qualifications List Section -->
    <div class="qualifications-list-section">
      <h5 class="section-title mt-3"><i class="fa fa-bars"></i>Qualification List</h5>

      <table class="table table-bordered qualification-table">
        <thead>
          <tr>
            <th>Qualification Code</th>
            <th>Qualification Name</th>
            <th class="action-col-header">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let item of paginatedQualification(); let i = index"
            [class.edit-row]="editIndex === currentPageStart + i"
          >
            <td>{{ item.code }}</td>
            <td>{{ item.name }}</td>

            <td class="action-col">
              <i
                class="fa fa-edit action-icon"
                (click)="editqualification(currentPageStart + i)"
              ></i>
              <i
                class="fa fa-trash action-icon"
                (click)="deletequalification(currentPageStart + i)"
              ></i>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- ✅ GLOBAL PAGINATION (Same as Candidate Table) -->
      <div class="d-flex justify-content-end mt-3 me-3">
        <nav aria-label="Page navigation">
          <ul class="pagination">

            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="changePage(currentPage - 1)" aria-label="Previous">
                &laquo;
              </a>
            </li>

            <li
              class="page-item"
              *ngFor="let page of totalPagesArray"
              [class.active]="page === currentPage"
            >
              <a class="page-link" (click)="changePage(page)">{{ page }}</a>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="changePage(currentPage + 1)" aria-label="Next">
                &raquo;
              </a>
            </li>

          </ul>
        </nav>
      </div>

    </div>
  </ng-container>

  <!-- Form Page -->
  <ng-template #formPage>
    <div class="form-page">
      <h5 class="section-title mb-3">
        {{ isEdit ? "Edit qualification" : "New qualification" }}
      </h5>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Qualification Code <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="qualificationCode"
            [readonly]="isEdit"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Qualification Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="qualificationName" />
        </div>
      </div>

      <div class="btn-row mt-2">
        <button
          class="btn btn-primary"
          (click)="isEdit ? updatequalification() : createqualification()"
        >
          <i class="fa fa-check-circle"></i> {{ isEdit ? "UPDATE" : "CREATE" }}
        </button>
        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> CANCEL
        </button>
      </div>
    </div>
  </ng-template>
</div>
