<div class="prereq-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Pre-Requisites</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage" (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input
            type="text"
            class="form-control"
            placeholder="Search..."
            [(ngModel)]="searchText"
                         (ngModelChange)="updatePagination()"

          />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Pre-Requisites Table -->
      <div class="prereq-list-section">
        <table class="table table-bordered prereq-table">
          <thead>
            <tr>
              <th>Pre Requisite Name</th>
              <th>Is Active</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let item of paginatedPrereqsList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i"
            >
              <td>{{ item.name }}</td>
              <td>{{ item.isActive ? 'Yes' : 'No' }}</td>
              <td class="action-col">
                <i
                  class="fa fa-edit action-icon"
                  (click)="editPrereq()"
                ></i>
                <i
                  class="fa fa-trash action-icon"
                  (click)="deletePrereq(currentPageStart + i)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
         <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>
      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <div class="col-md-6 mb-3">
          <label>Pre Requisite Name <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Pre Requisite Name"
            [(ngModel)]="name"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Is Active <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="isActive">
            <option [value]="true">Active</option>
            <option [value]="false">Inactive</option>
          </select>
        </div>

      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">

        
        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
        <button
          class="btn btn-primary"
          (click)="isEdit ? updatePrereq() : createPrereq()"
        >
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

      </div>
    </div>
</div>
