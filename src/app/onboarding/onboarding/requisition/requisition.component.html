<div class="req-form-container">
  <div class="req-form-card">
    <div class="form-header">
      <h2 class="form-title">Create New Requisition</h2>
      <p class="form-subtitle">Define a new requisition request</p>
    </div>

    <form class="req-form">
      <!-- Row 1: Requisition Id & Name -->
      <div class="form-row">
        <div class="form-group">
          <label class="input-label">Requisition Id <span class="required">*</span></label>
          <input type="number" class="form-input" [(ngModel)]="requisitionId" name="requisitionId" placeholder="Enter Requisition Id" required />
        </div>
        <div class="form-group">
          <label class="input-label">Requisition Name <span class="required">*</span></label>
          <input type="text" class="form-input" [(ngModel)]="requisitionName" name="requisitionName" placeholder="Enter Requisition Name" required />
        </div>
      </div>

      <!-- Row 2: Department & Job Title -->
      <div class="form-row">
        <div class="form-group">
          <label class="input-label">Department <span class="required">*</span></label>
          <div class="custom-dropdown" (click)="toggleDropdown($event,'department')">
            <div class="dropdown-selected">
              <span>{{ department || 'Select Department' }}</span>
              <i class="fa-solid fa-chevron-down dropdown-arrow" [class.rotate]="activeDropdown==='department'"></i>
            </div>
            <div class="dropdown-options" *ngIf="activeDropdown==='department'">
              <div class="dropdown-option" *ngFor="let d of departments" (click)="selectOption('department',d,$event)">{{ d }}</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="input-label">Job Title <span class="required">*</span></label>
          <div class="custom-dropdown" (click)="toggleDropdown($event,'jobTitle')">
            <div class="dropdown-selected">
              <span>{{ jobTitle || 'Select Job Title' }}</span>
              <i class="fa-solid fa-chevron-down dropdown-arrow" [class.rotate]="activeDropdown==='jobTitle'"></i>
            </div>
            <div class="dropdown-options" *ngIf="activeDropdown==='jobTitle'">
              <div class="dropdown-option" *ngFor="let j of jobTitles" (click)="selectOption('jobTitle',j,$event)">{{ j }}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 3: Designation & No of Employees -->
      <div class="form-row">
        <div class="form-group">
          <label class="input-label">Designation <span class="required">*</span></label>
          <div class="custom-dropdown" (click)="toggleDropdown($event,'designation')">
            <div class="dropdown-selected">
              <span>{{ designation || 'Select Designation' }}</span>
              <i class="fa-solid fa-chevron-down dropdown-arrow" [class.rotate]="activeDropdown==='designation'"></i>
            </div>
            <div class="dropdown-options" *ngIf="activeDropdown==='designation'">
              <div class="dropdown-option" *ngFor="let d of designations" (click)="selectOption('designation',d,$event)">{{ d }}</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="input-label">No Of Employees Required</label>
          <input type="number" class="form-input" [(ngModel)]="noOfEmployees" name="noOfEmployees" placeholder="e.g., 2" min="0" />
        </div>
      </div>

      <!-- Row 4: Required Date & Job Description -->
      <div class="form-row">
        <div class="form-group">
          <label class="input-label">Required Date <span class="required">*</span></label>
          <input type="date" class="form-input" [(ngModel)]="requiredDate" name="requiredDate" required />
        </div>
<div class="form-group">
          <label class="input-label">Hiring Manager <span class="required">*</span></label>
          <div class="custom-dropdown" (click)="toggleDropdown($event,'hiringManager')">
            <div class="dropdown-selected">
              <span>{{ hiringManager || 'Select Hiring Manager' }}</span>
              <i class="fa-solid fa-chevron-down dropdown-arrow" [class.rotate]="activeDropdown==='hiringManager'"></i>
            </div>
            <div class="dropdown-options" *ngIf="activeDropdown==='hiringManager'">
              <div class="dropdown-option" *ngFor="let h of hiringManagers" (click)="selectOption('hiringManager',h,$event)">{{ h }}</div>
            </div>
          </div>
        </div>
      
      </div>

      <!-- Row 5: Hiring Manager & Status -->
      
         <div class="form-row full-width">
  <div class="form-group full-width">
    <label class="input-label">Description</label>
    <textarea class="form-input" [(ngModel)]="jobDescription" name="description" rows="4"
        placeholder="Enter role description"></textarea>
  </div>
</div>

<div class="form-row">
  <div class="form-group checkbox-group">
    <label class="checkbox-label">
      <input type="checkbox" class="checkbox-input" [(ngModel)]="status" name="status" />
      <span class="checkbox-text">Active</span>
    </label>
  </div>
</div>


      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-submit">Create Requisition</button>
      </div>
    </form>
  </div>
</div>
