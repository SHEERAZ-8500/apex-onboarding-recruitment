<div class="time-type-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Time Types</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage"
          (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input
            type="text"
            class="form-control"
            placeholder="Search..."
            [(ngModel)]="searchText"
                         (ngModelChange)="updatePagination()"

          />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Time Types Table -->
      <div class="time-types-list-section">
        <table class="table table-bordered time-type-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Description</th>
              <th>Start Time</th>
              <th>End Time</th>
              <th>Break Hours</th>
              <th>Week Off</th>
              <th>Work Schedule</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let item of paginatedTimeTypesList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i"
            >
              <td>{{ item.code }}</td>
              <td>{{ item.description }}</td>
              <td>{{ item.startTime }}</td>
              <td>{{ item.endTime }}</td>
              <td>{{ item.breakHours }} hours</td>
              
              <!-- Week Off Dropdown in Table -->
              <td>
                <select 
                  class="form-select table-dropdown" 
                  [(ngModel)]="item.weekOff"
                  (change)="onTableWeekOffChange(item, $event)"
                >
                  <option *ngFor="let option of dropdownOptions.weekOffOptions" [value]="option">
                    {{ option }}
                  </option>
                </select>
              </td>
              
              <!-- Work Schedule Dropdown in Table -->
              <td>
                <select 
                  class="form-select table-dropdown" 
                  [(ngModel)]="item.workSchedule"
                  (change)="onTableWorkScheduleChange(item, $event)"
                >
                  <option *ngFor="let option of dropdownOptions.workScheduleOptions" [value]="option">
                    {{ option }}
                  </option>
                </select>
              </td>

              <td class="action-col">
                <i
                  class="fa fa-edit action-icon"
                  (click)="editTimeType()"
                ></i>
                <i
                  class="fa fa-trash action-icon"
                  (click)="deleteTimeType(currentPageStart + i)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
         <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <!-- Time Type Code (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>Time Type Code <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Time Type Code"
            [(ngModel)]="timeTypeCode"
            [readonly]="isEdit"
          />
        </div>

        <!-- Time Type Description (Input Field) -->
        <div class="col-md-6 mb-3">
          <label>Time Type Description <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Time Type Description"
            [(ngModel)]="timeTypeDescription"
          />
        </div>

        <!-- Start Time (Time Field) -->
        <div class="col-md-6 mb-3">
          <label>Start Time <span class="text-danger">*</span></label>
          <div class="time-input-wrapper">
            <div class="time-input-group">
              <select class="form-select hour-select" [(ngModel)]="startTimeHour">
                <option value="">HH</option>
                <option *ngFor="let hour of hours" [value]="hour">{{ hour | number:'2.0' }}</option>
              </select>
              <span class="time-separator">:</span>
              <select class="form-select minute-select" [(ngModel)]="startTimeMinute">
                <option value="">MM</option>
                <option *ngFor="let minute of minutes" [value]="minute">{{ minute | number:'2.0' }}</option>
              </select>
              <select class="form-select period-select" [(ngModel)]="startTimePeriod">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
              </select>
            </div>
          </div>
        </div>

        <!-- End Time (Time Field) -->
        <div class="col-md-6 mb-3">
          <label>End Time <span class="text-danger">*</span></label>
          <div class="time-input-wrapper">
            <div class="time-input-group">
              <select class="form-select hour-select" [(ngModel)]="endTimeHour">
                <option value="">HH</option>
                <option *ngFor="let hour of hours" [value]="hour">{{ hour | number:'2.0' }}</option>
              </select>
              <span class="time-separator">:</span>
              <select class="form-select minute-select" [(ngModel)]="endTimeMinute">
                <option value="">MM</option>
                <option *ngFor="let minute of minutes" [value]="minute">{{ minute | number:'2.0' }}</option>
              </select>
              <select class="form-select period-select" [(ngModel)]="endTimePeriod">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Break Hours (Numeric Input) -->
        <div class="col-md-6 mb-3">
          <label>Break Hours <span class="text-danger">*</span></label>
          <input
            type="number"
            class="form-control"
            placeholder="Enter Break Hours"
            [(ngModel)]="breakHours"
            min="0"
            max="8"
            step="0.5"
          />
        </div>

        <!-- Weekdays Off (Dropdown) -->
        <div class="col-md-6 mb-3">
          <label>Weekdays Off <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="weekdaysOff">
            <option value="">Select Weekdays Off</option>
            <option *ngFor="let option of dropdownOptions.weekOffOptions" [value]="option">
              {{ option }}
            </option>
          </select>
        </div>

        <!-- Work Schedule (Dropdown) -->
        <div class="col-md-6 mb-3">
          <label>Work Schedule <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="workSchedule">
            <option value="">Select Work Schedule</option>
            <option *ngFor="let option of dropdownOptions.workScheduleOptions" [value]="option">
              {{ option }}
            </option>
          </select>
        </div>

      </div>

   
      <!-- Buttons -->
      <div class="btn-row text-end mt-2">

          <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
        <button
          class="btn btn-primary"
          (click)="isEdit ? updateTimeType() : createTimeType()"
          [disabled]="!isFormValid()"
        >
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

      
      </div>
    </div>
</div>
