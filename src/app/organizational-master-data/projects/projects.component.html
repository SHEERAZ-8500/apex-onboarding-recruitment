<div class="projects-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Projects</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input
            type="text"
            class="form-control"
            placeholder="Search..."
            [(ngModel)]="searchText"
          />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Projects Table -->
      <div class="projects-list-section">
        <table class="table table-bordered project-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let item of paginatedProjects(); let i = index"
              [class.edit-row]="editIndex === currentPageStart + i"
            >
              <td>{{ item.code }}</td>
              <td>{{ item.name }}</td>

              <td class="action-col">
                <i
                  class="fa fa-edit action-icon"
                  (click)="editProject()"
                ></i>
                <i
                  class="fa fa-trash action-icon"
                  (click)="deleteProject(currentPageStart + i)"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="d-flex justify-content-end mt-3 me-3">
          <nav aria-label="Page navigation">
            <ul class="pagination">

              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="changePage(currentPage - 1)">
                  &laquo;
                </a>
              </li>

              <li
                class="page-item"
                *ngFor="let page of totalPagesArray"
                [class.active]="page === currentPage"
              >
                <a class="page-link" (click)="changePage(page)">
                  {{ page }}
                </a>
              </li>

              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="changePage(currentPage + 1)">
                  &raquo;
                </a>
              </li>

            </ul>
          </nav>
        </div>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <div class="col-md-6 mb-3">
          <label>Project Code <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter Project Code"
            [(ngModel)]="projectCode"
            [readonly]="isEdit"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Project Name <span class="text-danger">*</span></label>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Enter Project Name" 
            [(ngModel)]="projectName" 
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Status <span class="text-danger">*</span></label>
          <select 
            class="form-select" 
            [(ngModel)]="projectStatus"
          >
            <option value="">Select Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">
        <button
          class="btn btn-primary"
          (click)="isEdit ? updateProject() : createProject()"
          [disabled]="!projectCode || !projectName || !projectStatus"
        >
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
      </div>
    </div>
</div>
