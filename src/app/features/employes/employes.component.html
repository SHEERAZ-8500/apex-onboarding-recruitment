<section class="container-fluid">
    <div class="page-title mb-3">
        <i class="fa-solid fa-house"></i>
        <span style="font-weight: 700; color: #566f9e;">-</span>
        <span>People</span>
    </div>
    <div class="btn-groups-main-div">
        <button *ngFor="let s of statusList; let i = index" [class.active]="activeIndex === i"
            (click)="activeIndex = i">
            <span>0</span> {{ s }}
        </button>

    </div>
    <app-candidate-table [candidates]="myCandidates"></app-candidate-table>
</section>
