<section class="container-fluid login-section " [ngClass]="{'dark-mode': isDarkMode, 'light-mode': !isDarkMode}">
    <!-- Animated Background -->
    <div class="gradient-bg">
        <div class="gradient-circle circle-1"></div>
        <div class="gradient-circle circle-2"></div>
        <div class="gradient-circle circle-3"></div>
    </div>

    <div class="login-wrapper d-flex justify-content-center align-items-center">
        <div class="login-card">
            <!-- Logo Section -->
            <div class="logo-section text-center mb-4">
                <div class="logo-circle">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="welcome-title mt-3">Welcome Back</h2>
                <p class="welcome-subtitle">Sign in to continue to your account</p>
            </div>

            <form class="login-form">
                <!-- Email Field -->
                <div class="mb-4 input-group-custom">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" name="email" [(ngModel)]="email" required 
                               placeholder="Enter your email" class="form-control input-field" />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-4 input-group-custom">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper position-relative">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" 
                               required placeholder="Enter your password" class="form-control input-field" />
                        <i [ngClass]="showPassword ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'" 
                           (click)="togglePassword()" class="toggle-eye"></i>
                    </div>
                </div>

                <!-- Remember & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label remember-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn login-btn w-100" [disabled]="loading" (click)="onLogin()">
                    <span *ngIf="!loading" class="d-flex align-items-center justify-content-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Sign In
                    </span>
                    <div *ngIf="loading" class="lds-hourglass"></div>
                </button>

                <!-- Divider -->
                <div class="divider my-4">
                    <span>or continue with</span>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-login d-flex gap-3">
                    <button type="button" class="btn social-btn flex-fill">
                        <i class="fa-brands fa-google"></i>
                    </button>
                    <button type="button" class="btn social-btn flex-fill">
                        <i class="fa-brands fa-github"></i>
                    </button>
                    <button type="button" class="btn social-btn flex-fill">
                        <i class="fa-brands fa-microsoft"></i>
                    </button>
                </div>

                <!-- Sign Up Link -->
                <div class="text-center mt-4 signup-link">
                    <span>Don't have an account? </span>
                    <a href="#">Sign up now</a>
                </div>
            </form>
        </div>
    </div>
</section>
