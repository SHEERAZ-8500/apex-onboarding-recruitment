<section class="container-fluid">
    <div class="login-wrapper d-flex justify-content-center align-items-center">
        <div class="login-card p-4 rounded shadow-lg">
            <h2 class="text-center mb-4 wellcom-back">Welcome Back</h2>

            <form >
                <div class="mb-3">
                    <label class="form-label ">Email</label>
                    <input type="email" name="email" [(ngModel)]="email" required placeholder="Enter your email"
                        class="form-control input-field" />
                </div>

                <!-- Password Field -->
                <div class="mb-3 position-relative">
                    <label class="form-label ">Password</label>
                    <input [type]="showPassword ? 'password' : 'text'" name="password"  [(ngModel)]="password" required
                        placeholder="Enter your password" class="form-control input-field" />
                    <i [ngClass]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" (click)="togglePassword()"
                        class="toggle-eye"></i>
                </div>

                <button type="submit" class="btn login-btn w-100" [disabled]="loading" (click)="onLogin()" >
                    <span *ngIf="!loading">Login</span>
                    <div *ngIf="loading" class="lds-hourglass"></div>
                </button>
            </form>
        </div>
    </div>
</section>
