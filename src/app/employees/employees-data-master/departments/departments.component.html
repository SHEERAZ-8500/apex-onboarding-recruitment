<div class="skills-wrapper col-md-12">

  <!--   LIST VIEW  -->
  <ng-container *ngIf="!showForm; else formPage">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Departments</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Departments Table -->
      <div class="skills-list-section">
        <table class="table table-bordered skill-table">
          <thead>
            <tr>
              <th>Department Code</th>
              <th>Department Name</th>
              <th>Description</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let dept of paginatedDepartments(); let i = index"
              [class.edit-row]="editIndex === currentPageStart + i">
              <td>{{ dept.code }}</td>
              <td>{{ dept.name }}</td>
              <td>{{ dept.description }}</td>

              <td class="action-col">
                <i class="fa fa-edit action-icon" (click)="editDepartment(currentPageStart + i)"></i>
                <i class="fa fa-trash action-icon" (click)="deleteDepartment(currentPageStart + i)"></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="d-flex justify-content-end mt-3 me-3">
          <nav aria-label="Page navigation">
            <ul class="pagination">

              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="changePage(currentPage - 1)">
                  &laquo;
                </a>
              </li>

              <li class="page-item" *ngFor="let page of totalPagesArray" [class.active]="page === currentPage">
                <a class="page-link" (click)="changePage(page)">
                  {{ page }}
                </a>
              </li>

              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="changePage(currentPage + 1)">
                  &raquo;
                </a>
              </li>

            </ul>
          </nav>
        </div>

      </div>
    </div>
  </ng-container>



  <!--   FORM      -->
  <ng-template #formPage>
    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ isEdit ? "Edit Department" : "Add Department" }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <div class="form-row row">

        <div class="col-md-6 mb-3">
          <label>Department Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Department Code" [(ngModel)]="deptCode"
            [readonly]="isEdit" />
        </div>

        <div class="col-md-6 mb-3">
          <label>Department Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Department Name" [(ngModel)]="deptName" />
        </div>

        <div class="col-md-12 mb-3">
          <label>Description <span class="text-danger">*</span></label>
          <textarea class="form-control" placeholder="Enter Description" [(ngModel)]="deptDescription" rows="3"></textarea>
        </div>

      </div>

      <!-- Buttons -->
      <div class="btn-row text-end mt-2">
        <button class="btn btn-primary" (click)="isEdit ? updateDepartment() : createDepartment()">
          <i class="fa fa-check-circle"></i>
          {{ isEdit ? "Update" : "Create" }}
        </button>

        <button class="btn btn-danger ms-2" (click)="cancelForm()">
          <i class="fa fa-ban"></i> Cancel
        </button>
      </div>
    </div>
  </ng-template>
</div>
