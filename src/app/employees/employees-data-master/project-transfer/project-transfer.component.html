<div class="skills-wrapper col-md-12">

  <!-- ============================= -->
  <!--   LIST VIEW (When showForm = false)  -->
  <!-- ============================= -->
  <ng-container *ngIf="title === 'view'">

    <div class="card-container">

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">Project Transfers</h4>

        <button class="add-btn" (click)="onNew()">
          <i class="fa fa-plus"></i> Add New
        </button>
      </div>

      <hr class="divider" />

      <!-- Items Per Page + Search -->
      <div class="top-controls d-flex align-items-center">

        <!-- Items Per Page -->
        <div class="items-per-page">
          <label>Items per page:</label>
          <select class="form-select" [(ngModel)]="itemsPerPage"
          (change)="onItemsPerChange($event)">
            <option [ngValue]="5">5</option>
            <option [ngValue]="8">8</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper ms-auto">
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" 
                       (ngModelChange)="updatePagination()"
/>
          <i class="fa fa-search search-icon"></i>
        </div>
      </div>

      <!-- Project Transfers Table -->
      <div class="skills-list-section">
        <table class="table table-bordered skill-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Legacy Code</th>
              <th>Name</th>
              <th>Job Title</th>
              <th>Department</th>
              <th class="action-col-header">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let transfer of paginatedTransfersList; let i = index"
              [class.edit-row]="editIndex === currentPageStart + i">
              <td>{{ transfer.code }}</td>
              <td>{{ transfer.legacyCode }}</td>
              <td>{{ transfer.name }}</td>
              <td>{{ transfer.jobTitle }}</td>
              <td>{{ transfer.department }}</td>

              <td class="action-col">
                <i class="fa fa-edit action-icon" (click)="editTransfer()"></i>
                <i class="fa fa-trash action-icon" (click)="deleteTransfer(currentPageStart + i)"></i>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
         <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [totalPagesArray]="totalPagesArray"
          (pageChange)="changePage($event)">
        </app-pagination>

      </div>
    </div>
  </ng-container>



  <!-- ============================= -->
  <!--   FORM VIEW (NEW / EDIT)     -->
  <!-- ============================= -->
    <div class="card-container" *ngIf = 'title === "create" || title === "edit" '>

      <!-- Header Row -->
      <div class="header-row">
        <h4 class="main-title">
          {{ formTitle }}
        </h4>

        <button class="reset-btn" (click)="resetForm()">
          <i class="fa fa-refresh"></i> Reset
        </button>
      </div>

      <hr class="divider" />

      <!-- Form -->
      <form class="form-row row" (ngSubmit)="isEdit ? updateTransfer() : createTransfer()">

        <div class="col-md-6 mb-3">
          <label>From Project <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="fromProject" name="fromProject" required>
            <option value="" disabled selected>Select From Project</option>
            <option *ngFor="let project of projects" [value]="project">{{ project }}</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Transfer Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" [(ngModel)]="transferDate" name="transferDate" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>To Project <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="toProject" name="toProject" required>
            <option value="" disabled selected>Select To Project</option>
            <option *ngFor="let project of projects" [value]="project">{{ project }}</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Employee Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Employee Name" [(ngModel)]="employeeName"
            name="employeeName" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Employee Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Employee Code" [(ngModel)]="employeeCode"
            name="employeeCode" [readonly]="isEdit" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Legacy Code</label>
          <input type="text" class="form-control" placeholder="Enter Legacy Code" [(ngModel)]="legacyCode"
            name="legacyCode" />
        </div>

        <div class="col-md-6 mb-3">
          <label>Job Title <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Job Title" [(ngModel)]="jobTitle"
            name="jobTitle" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Department <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Enter Department" [(ngModel)]="department"
            name="department" required />
        </div>

        <div class="col-12 mt-3">
          <div class="btn-row text-end">
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-check-circle"></i>
              {{ isEdit ? "Update" : "Create" }}
            </button>

            <button type="button" class="btn btn-danger ms-2" (click)="cancelForm()">
              <i class="fa fa-ban"></i> Cancel
            </button>
          </div>
        </div>

      </form>
    </div>
</div>
